services:
  app:
    build: .
    container_name: effective-business
    env_file:
      - .env
    environment:
      MINI_APP_PORT: "8080"
    volumes:
      - ./data.json:/app/data.json
      - ./miniapp/uploads:/app/miniapp/uploads
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: effective-business-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/extra:/etc/nginx/extra:ro
      - ./nginx/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped
